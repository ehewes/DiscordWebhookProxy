[package]
name = "discord-webhook-proxy"
version = "1.0.0"
edition = "2024"
authors = ["ehewes", "maefall"]
description = "Discord webhook proxy with rate-limit queueing, persistent storage, and full API compatibility."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ehewes/DiscordWebhookProxy"
repository = "https://github.com/ehewes/DiscordWebhookProxy"
keywords = [
  "async",
  "discord",
  "proxy",
  "webhook",
]
categories = [
  "api-bindings",
  "network-programming",
  "web-programming::http-server",
]

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
  "http2",
  "json",
  "rustls"
] }
rocket = { version = "0.5.1", default-features = false, features = ["json"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sled = { version = "0.34.7", default-features = false, features = [
  "compression"
] }
tokio = { version = "1.53.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time"
] }
tracing = { version = "0.1.44", default-features = false, features = [
  "attributes",
  "std"
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std"
] }
