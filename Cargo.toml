[package]
name = "discord-webhook-proxy"
version = "1.0.0"
edition = "2024"
authors = ["ehewes, bordomantra"]
description = "DiscordWebhookProxy is a powerful Discord proxy service designed for Roblox, built to prevent abuse and provide secure relaying."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ehewes/DiscordRustScraper"
repository = "https://github.com/ehewes/DiscordRustScraper"
keywords = ["cli", "discord", "bot", "webhook", "proxy"]
categories = ["command-line-utilities"]

[dependencies]
minreq = { version = "3.0.0", features = ["https"] }
rocket = { version = "0.5.1", default-features = false, features = ["json"] }
tokio = "1.44.1"
time = "0.3.40"
serde_json = "1.0.140"
sled = "0.34"
diesel = "2.2.12"
chrono = "0.4.45"
